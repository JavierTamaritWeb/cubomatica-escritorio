[project]
name = "cubomatica"
version = "4.12.0"
description = "Cubomática — juego de matemáticas para 2.º de Primaria, app de escritorio con pywebview (HTML + CSS + JS vanilla)"
requires-python = ">=3.11"

# ---- LIBRERIAS CON VERSION FIJA ----
# El "==" fija la version exacta. Nunca cambiara sola.
dependencies = [
    "pywebview==5.3.2",
]

[project.optional-dependencies]
# Solo para desarrollar. No se instala en el usuario final.
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
    "pyinstaller==6.10.0",
]

# ---- COMANDO PARA LANZAR LA APP ----
# Despues de "uv sync" podras escribir:  cubomatica
[project.scripts]
cubomatica = "cubomatica.main:main"


# ---- VERSION MINIMA DE LA HERRAMIENTA uv ----
# Si alguien usa un uv mas viejo, uv se niega a trabajar y avisa.
# Comprobado: uv 0.11.7 con ">=0.12.0" da error claro y no continua.
[tool.uv]
required-version = ">=0.12.0"


# ---- CONFIGURACION DEL EMPAQUETADO ----
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cubomatica"]


# ---- CONFIGURACION DEL LINTER (opcional) ----
[tool.ruff]
line-length = 100
target-version = "py311"


# ---- CONFIGURACION DE PYTEST ----
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
